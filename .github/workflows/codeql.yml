name: CodeQL

on:
  push:
    branches: [main, "freebuff/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write

jobs:
  detect-code:
    runs-on: ubuntu-latest
    outputs:
      has_js_ts: ${{ steps.detect.outputs.has_js_ts }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "has_js_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_js_ts=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No JavaScript/TypeScript source imported yet; CodeQL analysis is skipped until the vertical apps are migrated."
          fi

  analyze:
    needs: detect-code
    if: needs.detect-code.outputs.has_js_ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-sarif
      - name: Capture high-severity CodeQL findings for staging diagnostics
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('codeql-sarif');
          const files = [];
          const lines = [];
          const walk = (dir) => {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith('.sarif')) files.push(file);
            }
          };
          walk(root);
          for (const file of files) {
            const sarif = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const run of sarif.runs ?? []) {
              const rules = new Map((run.tool?.driver?.rules ?? []).map((rule) => [rule.id, rule]));
              for (const result of run.results ?? []) {
                const rule = rules.get(result.ruleId) ?? {};
                const severity = Number(rule.properties?.['security-severity'] ?? 0);
                if (severity < 7) continue;
                const location = result.locations?.[0]?.physicalLocation;
                const artifact = location?.artifactLocation?.uri ?? 'unknown';
                const line = location?.region?.startLine ?? 'unknown';
                const message = result.message?.text ?? '';
                lines.push(`CODEQL_HIGH rule=${result.ruleId} severity=${severity} file=${artifact} line=${line}`);
                lines.push(`CODEQL_HIGH message=${message}`);
              }
            }
          }
          if (!lines.length) lines.push('CODEQL_HIGH none');
          fs.writeFileSync('codeql-high.txt', `${lines.join('\n')}\n`);
          console.log(lines.join('\n'));
          NODE
      - name: Commit diagnostic file on temporary security branch
        if: always() && github.ref_name == 'fix/builder-sections-security-stage'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codeql-high.txt
          if git diff --cached --quiet; then
            echo "Diagnostic unchanged."
          else
            git commit -m "chore(security): capture CodeQL high diagnostic"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
