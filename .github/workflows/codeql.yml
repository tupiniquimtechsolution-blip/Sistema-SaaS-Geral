name: CodeQL

on:
  push:
    branches: [main, "freebuff/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write

jobs:
  detect-code:
    runs-on: ubuntu-latest
    outputs:
      has_js_ts: ${{ steps.detect.outputs.has_js_ts }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "has_js_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_js_ts=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No JavaScript/TypeScript source imported yet; CodeQL analysis is skipped until the vertical apps are migrated."
          fi

  analyze:
    needs: detect-code
    if: needs.detect-code.outputs.has_js_ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-sarif
      - name: Capture CodeQL result metadata for staging diagnostics
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('codeql-sarif');
          const files = [];
          const rows = [];
          const walk = (dir) => {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith('.sarif')) files.push(file);
            }
          };
          walk(root);
          for (const file of files) {
            const sarif = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const run of sarif.runs ?? []) {
              const allRules = [
                ...(run.tool?.driver?.rules ?? []),
                ...((run.tool?.extensions ?? []).flatMap((extension) => extension.rules ?? [])),
              ];
              const rules = new Map(allRules.map((rule) => [rule.id, rule]));
              for (const result of run.results ?? []) {
                const rule = rules.get(result.ruleId) ?? {};
                const location = result.locations?.[0]?.physicalLocation;
                rows.push({
                  ruleId: result.ruleId ?? null,
                  level: result.level ?? null,
                  securitySeverity: rule.properties?.['security-severity'] ?? result.properties?.['security-severity'] ?? null,
                  precision: rule.properties?.precision ?? result.properties?.precision ?? null,
                  tags: rule.properties?.tags ?? [],
                  file: location?.artifactLocation?.uri ?? null,
                  line: location?.region?.startLine ?? null,
                  message: result.message?.text ?? null,
                });
              }
            }
          }
          rows.sort((a, b) => String(a.file).localeCompare(String(b.file)) || Number(a.line ?? 0) - Number(b.line ?? 0));
          fs.writeFileSync('codeql-results.txt', `${rows.map((row) => JSON.stringify(row)).join('\n')}${rows.length ? '\n' : ''}`);
          const highRows = rows.filter((row) => Number(row.securitySeverity ?? 0) >= 7);
          fs.writeFileSync('codeql-high.txt', `${highRows.length ? highRows.map((row) => JSON.stringify(row)).join('\n') : 'CODEQL_HIGH none'}\n`);
          console.log(`Captured ${rows.length} CodeQL result(s); ${highRows.length} with security-severity >= 7.`);
          NODE
      - name: Commit diagnostic files on temporary security branch
        if: always() && github.ref_name == 'fix/builder-sections-security-stage'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codeql-high.txt codeql-results.txt
          if git diff --cached --quiet; then
            echo "Diagnostic unchanged."
          else
            git commit -m "chore(security): capture CodeQL result metadata"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
