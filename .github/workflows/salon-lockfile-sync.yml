name: Salon Lockfile Sync

on:
  push:
    branches:
      - automation/wave01-salon
    paths:
      - apps/salon/package.json
      - .github/workflows/salon-lockfile-sync.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/wave01-salon
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate deterministic root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(salon): synchronize root lockfile"
          git push origin HEAD:automation/wave01-salon
