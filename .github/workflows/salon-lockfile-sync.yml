name: Salon Lockfile Sync

on:
  push:
    branches:
      - automation/wave01-salon
    paths:
      - apps/salon/package.json
      - .github/workflows/salon-lockfile-sync.yml

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate deterministic root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: salon-root-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
