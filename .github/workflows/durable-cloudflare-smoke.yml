name: Durable Cloudflare Smoke Matrix

on:
  push:
    branches:
      - automation/cloudflare-durable-smoke-matrix
      - chatgpt/release-green-convergence
    paths:
      - '.github/workflows/durable-cloudflare-smoke.yml'
      - 'tests/e2e/durable-deploy-smoke.spec.ts'
  pull_request:
    branches:
      - freebuff/big-master-wave-01-monorepo
    paths:
      - '.github/workflows/durable-cloudflare-smoke.yml'
      - 'tests/e2e/durable-deploy-smoke.spec.ts'
      - 'apps/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-smoke:
    name: smoke-${{ matrix.vertical }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - vertical: platform
            url: https://tupiniquim-saas.tupiniquim-techsolution.workers.dev
            title: 'Tupiniquim SaaS'
          - vertical: bakery
            url: https://tupiniquim-bakery.tupiniquim-techsolution.workers.dev
            title: 'Fornalha'
          - vertical: pet
            url: https://tupiniquim-pet.tupiniquim-techsolution.workers.dev
            title: 'Amora Pet'
          - vertical: restaurant
            url: https://tupiniquim-restaurant.tupiniquim-techsolution.workers.dev
            title: 'Chez Amis'
          - vertical: metalart
            url: https://tupiniquim-metalart.tupiniquim-techsolution.workers.dev
            title: 'Metal & Art'
          - vertical: heavy-machinery
            url: https://tupiniquim-heavy-machinery.dramatic-condition.workers.dev
            title: 'Lusomaq'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: HTTPS reachability preflight
        env:
          TARGET_URL: ${{ matrix.url }}
        run: |
          curl --fail --silent --show-error --location --max-time 30 "$TARGET_URL" >/tmp/home.html
          test -s /tmp/home.html
      - name: Browser, asset, SPA refresh, console and network smoke
        env:
          DURABLE_SMOKE_URL: ${{ matrix.url }}
          DURABLE_SMOKE_TITLE: ${{ matrix.title }}
        run: npx playwright test tests/e2e/durable-deploy-smoke.spec.ts --reporter=line
