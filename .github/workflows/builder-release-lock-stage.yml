name: Builder Release Lock Stage

on:
  push:
    branches:
      - automation/builder-release-gates-stage
    paths:
      - apps/builder/package.json
      - .github/workflows/builder-release-lock-stage.yml

permissions:
  contents: write

jobs:
  reconcile-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/builder-release-gates-stage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reconcile npm lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(builder): reconcile release gate lockfile"
          git push origin HEAD:automation/builder-release-gates-stage
