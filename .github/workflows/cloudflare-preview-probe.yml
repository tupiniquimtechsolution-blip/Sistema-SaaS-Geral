name: Cloudflare Preview Probe

on:
  push:
    branches:
      - automation/release-green-external-gates-01
    paths:
      - ".github/workflows/cloudflare-preview-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy-machinery-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Create isolated Heavy Machinery Preview
        shell: bash
        run: |
          set -euo pipefail
          preview="rg-probe-${GITHUB_SHA:0:8}"
          npx wrangler preview             --config apps/heavy-machinery/wrangler.jsonc             --name "$preview"             --tag "rg-probe"             --message "Release GREEN preview probe ${GITHUB_SHA}"             --json 2>&1 | tee /tmp/preview.json.log
          grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/preview.json.log | sort -u | tee /tmp/preview-urls.txt
          test -s /tmp/preview-urls.txt
          url="$(tail -1 /tmp/preview-urls.txt)"
          curl --fail --silent --show-error --location --max-time 30 "$url" >/tmp/preview-home.html
          test -s /tmp/preview-home.html
          {
            echo "## Heavy Machinery Cloudflare Preview probe"
            echo
            echo "Preview creation and HTTPS fetch succeeded without production deployment."
            echo
            echo "URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-probe-${{ github.sha }}
          path: |
            /tmp/preview.json.log
            /tmp/preview-urls.txt
          if-no-files-found: ignore
          retention-days: 7
