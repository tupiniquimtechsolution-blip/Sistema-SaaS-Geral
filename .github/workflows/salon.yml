name: Salon Vanessa Gates

on:
  push:
    branches:
      - chatgpt/integrate-salon-vanessa
    paths:
      - 'apps/salon/**'
      - 'packages/**'
      - 'supabase/**'
      - 'scripts/provisioning/vanessa_braz_tenant.sql'
      - 'tests/postgres/salon_*.real.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/salon.yml'
  pull_request:
    paths:
      - 'apps/salon/**'
      - 'packages/**'
      - 'supabase/**'
      - 'scripts/provisioning/vanessa_braz_tenant.sql'
      - 'tests/postgres/salon_*.real.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/salon.yml'

permissions:
  contents: read

jobs:
  salon-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck Salon
        run: npm run typecheck:salon

      - name: Build Salon
        run: npm run build:salon

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  salon-postgres-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Prove tenant integrity and booking overlap in real Postgres
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/salon_booking_integrity.real.sql

      - name: Create isolated provisioning test database
        run: createdb salon_provisioning

      - name: Prove Salon registry and Vanessa provisioning are idempotent
        env:
          PGDATABASE: salon_provisioning
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/salon_tenant_provisioning.real.sql
