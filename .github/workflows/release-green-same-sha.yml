name: Release GREEN Same-SHA Evidence

on:
  push:
    branches:
      - freebuff/big-master-wave-01-monorepo
      - feature/ui-saas-convergence-wave-01
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: release-green-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: aggregate-release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TRACKING_PR: ${{ github.ref_name == 'feature/ui-saas-convergence-wave-01' && '19' || '2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for same-SHA required workflows
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "Monorepo Quality Gates"
            "CodeQL"
            "Salon Vanessa Gates"
            "Builder Release Gates"
            "Cloudflare RC Stage"
          )

          for attempt in $(seq 1 160); do
            payload="$(gh api               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"

            ready=1
            failed=0
            summary=""

            for workflow in "${required[@]}"; do
              row="$(jq -r --arg workflow "$workflow" '
                [.workflow_runs[] | select(.name == $workflow)]
                | sort_by(.created_at)
                | last
                | if . == null then "MISSING|-"
                  else (.status + "|" + (.conclusion // "-"))
                  end
              ' <<<"$payload")"

              status="${row%%|*}"
              conclusion="${row#*|}"
              summary+="${workflow}: ${status}/${conclusion}"$'\n'

              if [ "$status" != "completed" ]; then
                ready=0
              elif [ "$conclusion" != "success" ]; then
                failed=1
              fi
            done

            printf '%s' "$summary"

            if [ "$failed" -eq 1 ]; then
              echo "::error::At least one same-SHA Release GREEN prerequisite failed."
              exit 1
            fi

            if [ "$ready" -eq 1 ]; then
              {
                echo "summary<<EOF"
                printf '%s' "$summary"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for same-SHA Release GREEN prerequisites."
          exit 1

      - name: Classify internal release state
        shell: bash
        run: |
          {
            echo "## Release GREEN automated evidence"
            echo
            echo "SHA: $GITHUB_SHA"
            echo
            printf '%s\n' "${{ steps.gates.outputs.summary }}"
            echo
            echo "INTERNAL + CLOUDFLARE-PREVIEW-STAGE GREEN"
            echo
            echo "This does not declare full Release GREEN."
            echo "Stripe Test Mode E2E, AI provider live smoke, authorized hostname/TLS, production deployment/rollback proof and any remaining external gates stay independent."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record evidence on Wave 01 PR when available
        shell: bash
        run: |
          set -euo pipefail

          if ! gh api "/repos/${GITHUB_REPOSITORY}/pulls/${TRACKING_PR}" >/tmp/pr.json 2>/dev/null; then
            echo "::notice::Tracking PR #${TRACKING_PR} is not available; skipping PR comment."
            exit 0
          fi

          body="## Automated same-SHA internal Release GREEN evidence

          SHA: ${GITHUB_SHA}

          Monorepo Quality Gates — PASS
          CodeQL — PASS
          Salon Vanessa Gates — PASS
          Builder Release Gates — PASS
          Cloudflare RC Stage — PASS

          Cloudflare stage creates isolated Worker Previews and runs browser/HTTPS smoke against immutable Preview deployment URLs without promoting production traffic.

          State: INTERNAL + CLOUDFLARE-STAGE GREEN, not full Release GREEN.

          Still independent: Stripe Test Mode E2E, AI provider live proposal smoke, authorized hostname/TLS proof, production deployment + rollback proof, and any remaining release checklist gates."

          gh api             --method POST             "/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_PR}/comments"             -f body="$body"
