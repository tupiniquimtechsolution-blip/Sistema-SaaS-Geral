name: Cloudflare Worker Inventory

on:
  push:
    branches:
      - automation/release-green-external-gates-01
    paths:
      - ".github/workflows/cloudflare-worker-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Inventory release Workers read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare-inventory
          : > cloudflare-inventory/workers.tsv

          inspect() {
            local vertical="$1"
            local config="$2"
            local worker
            worker="$(node -e "const fs=require('fs'); const s=fs.readFileSync('$config','utf8'); const m=s.match(/\"name\"\s*:\s*\"([^\"]+)\"/); if(!m) process.exit(2); process.stdout.write(m[1])")"
            local log="cloudflare-inventory/${vertical}.log"

            set +e
            npx wrangler versions list --config "$config" >"$log" 2>&1
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              printf '%s\t%s\tEXISTS\n' "$vertical" "$worker" >> cloudflare-inventory/workers.tsv
            elif grep -Eqi 'does not exist|not found|could not find|no such' "$log"; then
              printf '%s\t%s\tMISSING\n' "$vertical" "$worker" >> cloudflare-inventory/workers.tsv
            else
              printf '%s\t%s\tERROR\n' "$vertical" "$worker" >> cloudflare-inventory/workers.tsv
            fi
          }

          inspect platform apps/platform/wrangler.jsonc
          inspect builder apps/builder/wrangler.jsonc
          inspect bakery apps/bakery/wrangler.jsonc
          inspect pet apps/pet/wrangler.jsonc
          inspect restaurant apps/restaurant/wrangler.jsonc
          inspect metalart apps/metalart/wrangler.jsonc
          inspect heavy-machinery apps/heavy-machinery/wrangler.jsonc
          inspect religious-house apps/religious-house/wrangler.jsonc
          inspect salon apps/salon/wrangler.jsonc

          {
            echo "## Cloudflare Worker inventory"
            echo
            echo "| Surface | Worker | State |"
            echo "|---|---|---|"
            awk -F '\t' '{printf "| %s | `%s` | **%s** |\n",$1,$2,$3}' cloudflare-inventory/workers.tsv
            echo
            echo "Read-only inventory only. No Worker was created, deployed or routed."
          } >> "$GITHUB_STEP_SUMMARY"

          cat cloudflare-inventory/workers.tsv

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-inventory-${{ github.sha }}
          path: cloudflare-inventory
          if-no-files-found: error
          retention-days: 14
