name: QA Vanessa - Import Approved Overhead Hero

on:
  push:
    branches: [qa/salon-premium-pwa-20261024]
    paths: [.github/workflows/qa-vanessa-import-approved-hero.yml]

permissions:
  contents: write

concurrency:
  group: qa-vanessa-hero-import
  cancel-in-progress: false

jobs:
  import-verified-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Require isolated QA branch and exact known base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/salon-premium-pwa-20261024
          test -f apps/salon/public/media/README-VANESSA-QA.md
          test ! -e apps/salon/public/media/espaco-vanessa-vista-superior.webp
      - name: Download user-approved WebP and verify exact digest
        shell: bash
        run: |
          set -euo pipefail
          dst=apps/salon/public/media/espaco-vanessa-vista-superior.webp
          curl --fail --silent --show-error --location --retry 3 --max-time 90             'https://d2ol7oe51mr4n9.cloudfront.net/user_3IECiF8gLsqJKI0xi8aT1Cd7lgn/43c2c662-2a95-4f3d-bb1f-33577aa6e4c0.webp'             --output "$dst"
          echo 'defd36a4dbf0e2d09eaf5a4220528ab5b45b7f168e8e892552940633f566a3e2  apps/salon/public/media/espaco-vanessa-vista-superior.webp' | sha256sum --check --status
          test "$(stat -c %s "$dst")" -eq 151300
          test "$(file --mime-type --brief "$dst")" = image/webp
          python3 - <<'PY'
          from pathlib import Path
          data=Path('apps/salon/public/media/espaco-vanessa-vista-superior.webp').read_bytes()
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          print('User-approved WebP SHA256 verified.')
          PY
      - name: Commit image bytes to QA branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/salon/public/media/espaco-vanessa-vista-superior.webp
          git diff --cached --exit-code && { echo 'Image missing from staging'; exit 1; } || true
          git commit -m 'assets(salon/qa): version approved overhead hero WebP [skip ci]'
          git push origin HEAD:refs/heads/qa/salon-premium-pwa-20261024
          echo 'Approved hero versioned in QA branch with fixed digest.' >> "$GITHUB_STEP_SUMMARY"
