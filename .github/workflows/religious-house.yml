name: Religious House Gates

on:
  push:
    branches:
      - automation/religious-house-import
      - freebuff/big-master-wave-01-monorepo
    paths:
      - 'apps/religious-house/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/religious-house.yml'
  pull_request:
    paths:
      - 'apps/religious-house/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/religious-house.yml'

permissions:
  contents: read

jobs:
  religious-house-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/automation/religious-house-import'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload canonical lockfile
        uses: actions/upload-artifact@v4
        with:
          name: religious-house-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2

  religious-house-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck Religious House
        run: npm run typecheck:religious-house
      - name: Build Religious House
        run: npm run build:religious-house
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
