name: Religious House Gates

on:
  push:
    branches:
      - automation/religious-house-import
      - freebuff/big-master-wave-01-monorepo
    paths:
      - 'apps/religious-house/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/religious-house.yml'
  pull_request:
    paths:
      - 'apps/religious-house/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/religious-house.yml'

permissions:
  contents: read

jobs:
  religious-house-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/automation/religious-house-import'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/religious-house-import
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(religious-house): sync canonical package lock'
          git push origin HEAD:automation/religious-house-import

  religious-house-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck Religious House
        run: npm run typecheck:religious-house
      - name: Build Religious House
        run: npm run build:religious-house
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
