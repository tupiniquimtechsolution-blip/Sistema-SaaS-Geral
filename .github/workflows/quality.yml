name: Monorepo Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reject nested Git repositories
        shell: bash
        run: |
          set -euo pipefail
          if find . -mindepth 2 -type d -name .git -print -quit | grep -q .; then
            echo "::error::Nested .git directory found. Import verticals as subtree/snapshot, not nested repositories."
            find . -mindepth 2 -type d -name .git -print
            exit 1
          fi

      - name: Reject committed dotenv secrets
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Potential dotenv secret files are tracked:"
            echo "$bad"
            exit 1
          fi

      - name: Verify canonical governance files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f SECURITY.md
          test -f .agents/skills/tupiniquim-toolbox/SKILL.md
          test -f docs/MIGRATION_MANIFEST.md
          test -f docs/PLANEJAMENTO_MESTRE_TUPINIQUIM_VERTICAL_SAAS.md

  node-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::error::Root package.json exists without package-lock.json. The canonical monorepo must use a locked install."
            exit 1
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Unit / integration tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  bakery-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Supabase auth compatibility
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d app <<'SQL'
          do $role$ begin create role anon nologin; exception when duplicate_object then null; end $role$;
          do $role$ begin create role authenticated nologin; exception when duplicate_object then null; end $role$;
          do $role$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $role$;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text);
          create or replace function auth.uid() returns uuid language sql stable as 'select null::uuid';
          SQL
      - name: Apply bakery contract baseline and canonical checkout migrations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d app -f tests/postgres/fixtures/bakery_checkout_base.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d app -f supabase/migrations/20260924125451_bakery_storefront_checkout_v1.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d app -f supabase/migrations/20260924125633_bakery_storefront_checkout_identity_fix.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d app -f supabase/migrations/20260924131525_bakery_coupon_enforcement_v1.sql
      - name: Bakery storefront checkout security contract
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d app -f tests/postgres/bakery_storefront_checkout.real.sql
